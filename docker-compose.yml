version: "3.8"

networks:
  gateway_edge:
    driver: bridge
  red_net:
    driver: bridge
    internal: true
  blue_net:
    driver: bridge
    internal: true
  target_net:
    driver: bridge
    internal: true

volumes:
  ollama_data:
  bayora_data:

services:
  # -------------------------------------------------------------
  # Gateway: The ONLY service joining red_net, blue_net, target_net, and edge
  # -------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bayora-gateway
    networks:
      - gateway_edge
      - red_net
      - blue_net
      - target_net
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - SERVICE_ROLE=unified
      - CORS_ORIGIN=http://localhost:3000
      - TARGET_LLM_PROVIDER=${TARGET_LLM_PROVIDER:-mock}
      - TARGET_LLM_ENDPOINT=http://target:11434
      - TARGET_LLM_MODEL=${TARGET_LLM_MODEL:-qwen2.5:0.5b}
      - TARGET_LLM_API_KEY=${TARGET_LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BAYORA_TOKEN_SECRET=${BAYORA_TOKEN_SECRET:-}
      - BAYORA_ADMIN_KEY=${BAYORA_ADMIN_KEY:-}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 2048m
    cpus: 2.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bayora_data:/app/.bayora
    restart: unless-stopped
    depends_on:
      - target

  # -------------------------------------------------------------
  # Red Team Sandbox: isolated strictly inside red_net (NO direct access to Blue or Target)
  # -------------------------------------------------------------
  red:
    image: node:20-alpine
    container_name: bayora-red-sandbox
    networks:
      - red_net
    user: "10001:10001"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 1024m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["sh", "-c", "echo 'Red sandbox initialized in isolated network'; sleep infinity"]
    restart: unless-stopped

  # -------------------------------------------------------------
  # Blue Team Sandbox: isolated strictly inside blue_net (NO direct access to Red or Target)
  # -------------------------------------------------------------
  blue:
    image: node:20-alpine
    container_name: bayora-blue-sandbox
    networks:
      - blue_net
    user: "10002:10002"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 1024m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: ["sh", "-c", "echo 'Blue defender initialized in isolated network'; sleep infinity"]
    restart: unless-stopped

  # -------------------------------------------------------------
  # Target Model: reachable EXCLUSIVELY from gateway via target_net
  # -------------------------------------------------------------
  target:
    image: ollama/ollama:latest
    container_name: bayora-target-model
    networks:
      - target_net
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    security_opt:
      - no-new-privileges:true
    pids_limit: 250
    mem_limit: 4096m
    cpus: 2.0
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # -------------------------------------------------------------
  # Web Dashboard: management console on edge network
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bayora-web
    networks:
      - gateway_edge
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - gateway
    restart: unless-stopped
