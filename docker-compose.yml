# Bayora PoC stack. Start with:  docker compose up -d --build   (after `pnpm setup` and the one-time model pull, see README)
#
# Networks
#   red_net, blue_net, target_net : internal (no route to the host network or the internet)
#   edge                          : only gateway + web, used to publish ports on 127.0.0.1
#   pull_net                      : used ONLY by the one-shot `puller` (profile "pull") to download the model
# Only `gateway` is attached to red_net, blue_net and target_net.

networks:
  red_net:
    internal: true
  blue_net:
    internal: true
  target_net:
    internal: true
  edge: {}
  pull_net: {}

volumes:
  ollama_models:
  gateway_data:
  red_payloads:
  blue_secrets:

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  gateway:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: bayora/gateway:local
    container_name: bayora-gateway
    user: "10003:10003"
    # The probe runner needs the Docker socket. This is a documented residual risk (README, threat T10).
    # Linux: set DOCKER_GID to the group id of /var/run/docker.sock. Docker Desktop: leave the default 0.
    group_add: ["${DOCKER_GID:-0}"]
    networks: [edge, red_net, blue_net, target_net]
    ports: ["127.0.0.1:4000:4000"]
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      TARGET_LLM_PROVIDER: ${TARGET_LLM_PROVIDER:-ollama}
      TARGET_LLM_ENDPOINT: http://target:11434
      TARGET_LLM_MODEL: ${TARGET_LLM_MODEL:-qwen2.5:0.5b}
      BLUE_FILTER_MODE: remote
      BLUE_FILTER_URL: http://blue:8081
      BLUE_DEFENSE_DEFAULT: ${BLUE_DEFENSE_DEFAULT:-on}
      BAYORA_TOKEN_SECRET: ${BAYORA_TOKEN_SECRET:?run 'pnpm setup' to create .env}
      BAYORA_ADMIN_KEY: ${BAYORA_ADMIN_KEY:?run 'pnpm setup' to create .env}
      BAYORA_RED_ENROLL_SECRET: ${BAYORA_RED_ENROLL_SECRET:?run 'pnpm setup' to create .env}
      BAYORA_BLUE_ENROLL_SECRET: ${BAYORA_BLUE_ENROLL_SECRET:?run 'pnpm setup' to create .env}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-300}
      GATEWAY_CONCURRENCY_CAP: ${GATEWAY_CONCURRENCY_CAP:-4}
    volumes:
      - gateway_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on: [red, blue, target]

  red:
    <<: *hardened
    build: { context: ., dockerfile: docker/red.Dockerfile }
    image: bayora/red:local
    container_name: bayora-red
    user: "10001:10001"
    networks: [red_net]
    environment:
      GATEWAY_URL: http://gateway:4000
      BAYORA_ENROLL_SECRET: ${BAYORA_RED_ENROLL_SECRET:?run 'pnpm setup' to create .env}
    volumes: [red_payloads:/payloads]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  blue:
    <<: *hardened
    build: { context: ., dockerfile: docker/blue.Dockerfile }
    image: bayora/blue:local
    container_name: bayora-blue
    user: "10002:10002"
    networks: [blue_net]
    environment:
      GATEWAY_URL: http://gateway:4000
      BAYORA_ENROLL_SECRET: ${BAYORA_BLUE_ENROLL_SECRET:?run 'pnpm setup' to create .env}
    volumes: [blue_secrets:/secrets]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

  target:
    <<: *hardened
    image: ollama/ollama:latest
    container_name: bayora-target
    user: "10004:10004"
    networks: [target_net]
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 30m
    volumes: ["ollama_models:/models:ro"]
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    pids_limit: 1024
    mem_limit: 4g
    cpus: 2.0

  # One-shot model download with internet access. The long-running `target` never has a route out.
  #   docker compose --profile pull run --rm puller
  puller:
    image: ollama/ollama:latest
    profiles: ["pull"]
    networks: [pull_net]
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 127.0.0.1:11434
      MODEL: ${TARGET_LLM_MODEL:-qwen2.5:0.5b}
    volumes: ["ollama_models:/models"]
    entrypoint: ["/bin/sh", "-c", "ollama serve >/tmp/serve.log 2>&1 & sleep 6; ollama pull \"$$MODEL\" && echo PULL_OK; kill %1"]

  web:
    <<: *hardened
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: bayora/web:local
    container_name: bayora-web
    user: "10005:10005"
    networks: [edge]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      BAYORA_API_URL: http://gateway:4000
      BAYORA_ADMIN_KEY: ${BAYORA_ADMIN_KEY:?run 'pnpm setup' to create .env}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/apps/web/.next/cache:rw,size=128m"]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    depends_on: [gateway]
